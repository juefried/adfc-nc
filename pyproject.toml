[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adfc-nc"
version = "0.1.0"
description = "Administrations-CLI für die ADFC-Nextcloud-Instanz"
readme = "README.md"
requires-python = ">=3.13"
dynamic = ["dependencies"]

[project.scripts]
adfc-nc = "adfc_nc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
packages = ["adfc_nc"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
